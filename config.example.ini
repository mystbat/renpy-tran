; py-tran 配置样例（config.example.ini）
; 复制为 config.ini 后填写。注意：本文件不得包含任何真实 API Key。
;
; 优先级（§12）：环境变量 TL_API_KEY > 本文件 [API] api_key。
; 运行时不要把真实 key 写进 config.ini（ADR-0004：key 只走环境变量）。

[API]
url = https://api.siliconflow.cn/v1
api_key =                              ; 留空；真实 key 通过环境变量 TL_API_KEY 注入

[Model]
model =                                ; 例如 Qwen/Qwen3-32B 或 deepseek-ai/DeepSeek-V3
fallback_model =                       ; §5.3 定点升级切换模型；空 = 不切换
max_tokens = 2048
temperature = 0.2
top_p = 0.9

[Engine]
max_workers = 3
timeout = 120
max_retry_rounds = 3
round_budget_cap = 5
keep_declare_rate_limit = 0.15
keep_declare_min_batch = 5
keep_declare_min_total = 20

[Game]
language = chinese
renpy_sdk_dir =                        ; Ren'Py SDK 目录（含 renpy.exe/renpy.sh）；空 = 未配置
